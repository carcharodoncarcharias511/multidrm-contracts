openapi: 3.0.3

info:
  title: Multi-DRM Gateway
  description: |
    Language-agnostic API contract for the Multi-DRM Gateway.

    The gateway exposes a synchronous, stateless HTTP API.
    Every request is assigned a server-generated request identifier
    returned via the X-Request-Id response header for observability
    and correlation.
  version: 1.0.0

servers:
  - url: https://api.example.com

paths:
  /v1/licenses:
    post:
      summary: Issue DRM license or certificate
      description: |
        Accepts a DRM-generated message (license challenge or provisioning request)
        and returns the corresponding DRM response.

        The gateway determines whether the request represents a certificate
        provisioning or a license issuance based on the DRM payload.
        Clients must not infer or specify request type.
      operationId: issueLicense
      tags:
        - License

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseRequest"

      responses:
        "200":
          description: DRM response successfully generated
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
          allOf:
            - $ref: "#/components/schemas/SuccessEnvelope"
            - type: object
              properties:
                data:
                  $ref: "#/components/schemas/LicenseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "500":
          $ref: "#/components/responses/InternalError"

components:

  headers:
    X-Request-Id:
      description: >
        Server-generated opaque identifier for correlating requests
        across services and logs.
      schema:
        type: string

  schemas:

    SuccessEnvelope:
      type: object
      required:
        - request_id
        - data
      properties:
        request_id:
          type: string
          description: Correlation ID for this request
        data:
          type: object
          additionalProperties: true

    # ErrorResponse:
    #   type: object
    #   required:
    #     - code
    #     - message
    #     - request_id
    #   properties:
    #     code:
    #       type: string
    #     message:
    #       type: string
    #     request_id:
    #       type: string

    LicenseRequest:
      type: object
      required:
        - drm_system
        - content_id
        - challenge
      properties:
        drm_system:
          type: string
          description: DRM system for which the license is requested.
          enum:
            - widevine
            - playready
            - fairplay
          example: widevine

        content_id:
          type: string
          description: >
            Identifier of the content or asset for which the license
            is being requested.
          example: movie-12345

        challenge:
          type: string
          format: byte
          description: >
            Base64-encoded DRM license challenge provided by the client.
          example: AAAANHBzc2gAAAAAmgRSAAAA...

        client_id:
          type: string
          description: Identifier of the calling client or application.
          example: web-player    

    LicenseResponse:
      type: object
      required:
        - drm_system
        - license
      properties:
        drm_system:
          type: string
          description: DRM system for which the license was issued.
          enum:
            - widevine
            - playready
            - fairplay
          example: widevine

        license:
          type: string
          format: byte
          description: >
            Base64-encoded DRM license issued by the DRM provider.
          example: AAAAXGxpY2Vuc2UAAAA...

        expires_at:
          type: string
          format: date-time
          description: >
            Optional expiration time of the license, if known.
          example: "2025-01-01T00:00:00Z"

    Error:
      type: object
      required:
        - code
        - message
        - retryable
        - request_id
      properties:
        code:
          type: string
          description: >
            Stable, machine-readable error code.
            Must not change once published.
          example: DRM_POLICY_DENIED
        message:
          type: string
          description: Human-readable description of the error.
          example: Device is not allowed to receive licenses
        retryable:
          type: boolean
          description: >
            Indicates whether the client may retry the request
            with the expectation that it could succeed.
          example: false
        request_id:
          type: string
          description: >
            Request identifier assigned by the gateway.
            Matches the X-Request-Id response header.
          example: c0a80123-9d8e-4c3b-9b3d-1f2b6a3e4f01

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"

  responses:

    BadRequest:
      description: Malformed or invalid request
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication failed
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Request denied by policy or DRM provider
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal gateway error
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"